# /etc/systemd/system/music-sync-sync.service.d/durum.conf
# Gece senkronu bitince o calismanin journal'ini ve liste adlarini
# /var/lib/music-sync-durum/ altina yazar; Hermes `durum.py` ile salt-okunur okur.
# Basarisiz olsa da senkronu etkilemez (`-` oneki).
[Service]
ExecStopPost=-/opt/music-sync/venv/bin/python /opt/music-sync/durum.py kaydet ${INVOCATION_ID}
